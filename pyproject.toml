[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "opencourantrp"
version = "1.0.0"
description = "OpenCourant Run and Postprocess: run OpenCourant decks and view the VTK results with PyVista."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "AGPL-3.0-or-later" }
dependencies = [
    "numpy",
    "pyvista>=0.43",
    "pyvistaqt>=0.11",
    "PySide6>=6.5",
    "pillow>=10",
    "imageio>=2.30",
    "imageio-ffmpeg>=0.4.9",
    "cmcrameri>=1.9",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.gui-scripts]
opencourantrp = "opencourantrp.app:main"

[project.scripts]
opencourantrp-console = "opencourantrp.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
opencourantrp = ["resources/*.bat", "resources/*.ps1", "resources/*.png", "resources/*.ico", "resources/*.html", "resources/icons/*.svg", "resources/icons/*.txt", "resources/fonts/*.otf", "resources/fonts/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
